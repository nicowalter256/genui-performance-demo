name: genui_perf_demo
description: >-
  FlutterBytes 2026 demo for "When the AI Builds the Widget Tree":
  the same GenUI trip planner in a naive and an optimised mode, with
  built-in performance metrics.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  dartantic_ai: ^3.2.0
  genui: ^0.10.0
  json_schema_builder: ^0.1.3
  logging: ^1.3.0
  a2ui_core: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
